<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>705 TOOLS DASHBOARD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg-dark: #0a0e17;
            --bg-panel: #111827;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff00aa;
            --neon-purple: #9d00ff;
            --text-main: #eaeaea;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--neon-cyan);
            font-size: 2.2rem;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--neon-pink);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Container Utama */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        /* Card Style */
        .card {
            background: var(--bg-panel);
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
            transition: 0.3s;
        }

        .card:hover {
            box-shadow: 0 0 20px rgba(255, 0, 170, 0.3);
            border-color: var(--neon-pink);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
        }

        .card h2 {
            font-size: 1.2rem;
            color: var(--neon-cyan);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Input & Textarea */
        textarea, input {
            width: 100%;
            background: #030712;
            color: var(--neon-cyan);
            border: 1px solid #374151;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            margin-bottom: 10px;
            outline: none;
        }

        textarea:focus, input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        /* Tombol */
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 8px 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            flex: 1;
        }

        button:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 10px var(--neon-cyan);
        }
